<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Hunter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Job<span>Hunter</span></h1>
      <div class="header-stats">
        <span class="chip chip-total" id="statTotal">0 total</span>
        <span class="chip chip-s" id="statS">0 S tier</span>
        <span class="chip chip-new" id="statNew">0 new</span>
        <span class="chip chip-applied" id="statApplied">0 applied</span>
        <span class="chip chip-interview" id="statInterview">0 interview</span>
      </div>
      <div class="header-actions">
        <button id="scrapeBtn" onclick="triggerScrape()">Scan Now</button>
        <a href="/api/cv" target="_blank" class="btn-link">My CV</a>
        <a href="/outreach.html" class="btn-link">Outreach</a>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- LEFT PANEL: Opportunities / Saved / Hidden -->
    <div class="panel panel-left">
      <div class="panel-header">
        <div class="tabs">
          <button class="tab active" data-view="new" onclick="setView('new')">Opportunities <span class="n" id="countNew">0</span></button>
          <button class="tab" data-view="favorites" onclick="setView('favorites')">★ Favorites <span class="n" id="countFavorites">0</span></button>
          <button class="tab" data-view="saved" onclick="setView('saved')">Saved <span class="n" id="countSaved">0</span></button>
          <button class="tab" data-view="hidden" onclick="setView('hidden')">Hidden <span class="n" id="countHidden">0</span></button>
          <button class="tab" data-view="filtered" onclick="setView('filtered')" title="Removed by the rules (US-only, senior…). Save one to rescue it.">Filtered <span class="n" id="countFiltered">0</span></button>
        </div>
        <span class="panel-count" id="leftCount">0</span>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search jobs, companies, skills..." oninput="debounceSearch()">
        <div class="filter-row">
          <select id="sourceFilter" onchange="loadJobs()">
            <option value="all">All Sources</option>
          </select>
          <select id="locationFilter" onchange="loadJobs()">
            <option value="all">All Locations</option>
            <option value="remote">Remote</option>
            <option value="ireland">Ireland</option>
            <option value="turkey">Turkey</option>
            <option value="uk">UK</option>
            <option value="europe">Europe</option>
            <option value="canada">Canada</option>
            <option value="singapore">Singapore</option>
            <option value="gulf">UAE / Gulf</option>
            <option value="anz">Australia / NZ</option>
          </select>
          <select id="priorityFilter" onchange="loadJobs()">
            <option value="all">All Tiers</option>
            <option value="S">S · 8.0+</option>
            <option value="A">A · 6.0–7.9</option>
            <option value="B">B · 4.0–5.9</option>
          </select>
          <select id="timeFilter" onchange="loadJobs()">
            <option value="all">Any Time</option>
            <option value="24h">Posted 24h</option>
            <option value="week" selected>Posted this week</option>
            <option value="2weeks">Posted 2 weeks</option>
            <option value="month">Posted this month</option>
          </select>
          <select id="sortFilter" onchange="loadJobs()">
            <option value="score">Best Match</option>
            <option value="date">Most Recent</option>
            <option value="company">Company A-Z</option>
          </select>
        </div>
      </div>

      <div id="jobsList" class="jobs-list">
        <div class="loading">Loading jobs...</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- RIGHT PANEL: Applied Jobs -->
    <div class="panel panel-right">
      <div class="panel-header">
        <h2>Applied</h2>
        <span class="panel-count" id="rightCount">0</span>
      </div>

      <div class="applied-filters">
        <select id="appliedSort" onchange="loadApplied()">
          <option value="applied">Most Recent</option>
          <option value="score">Best Match</option>
        </select>
      </div>

      <div id="appliedList" class="jobs-list applied-list">
        <div class="loading">No applications yet</div>
      </div>
    </div>
  </div>

  <!-- Job Detail Modal -->
  <div id="jobModal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

  <script src="/js/app.js"></script>
</body>
</html>
