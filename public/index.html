<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Hunter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Job Hunter</h1>
      <div class="header-stats">
        <span class="chip chip-total" id="statTotal">0 total</span>
        <span class="chip chip-new" id="statNew">0 new</span>
        <span class="chip chip-applied" id="statApplied">0 applied</span>
        <span class="chip chip-interview" id="statInterview">0 interview</span>
      </div>
      <div class="header-actions">
        <button id="scrapeBtn" onclick="triggerScrape()">Scan Now</button>
        <a href="/api/cv" target="_blank" class="btn-link">My CV</a>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- LEFT PANEL: Job Opportunities -->
    <div class="panel panel-left">
      <div class="panel-header">
        <h2>Opportunities</h2>
        <span class="panel-count" id="leftCount">0</span>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search jobs, companies, skills..." onkeyup="debounceSearch()">
        <div class="filter-row">
          <select id="sourceFilter" onchange="loadJobs()">
            <option value="all">All Sources</option>
            <option value="linkedin">LinkedIn</option>
            <option value="remoteok">RemoteOK</option>
            <option value="kariyer">Kariyer.net</option>
            <option value="toptalent">Toptalent.co</option>
          </select>
          <select id="locationFilter" onchange="loadJobs()">
            <option value="all">All Locations</option>
            <option value="remote">Remote</option>
            <option value="ireland">Ireland</option>
            <option value="turkey">Turkey</option>
            <option value="uk">UK</option>
            <option value="europe">Europe</option>
            <option value="usa">USA</option>
          </select>
          <select id="priorityFilter" onchange="loadJobs()">
            <option value="all">All Ratings</option>
            <option value="high">+++ Top</option>
            <option value="medium">++ Good</option>
            <option value="low">+ Other</option>
          </select>
          <select id="timeFilter" onchange="loadJobs()">
            <option value="all">Any Time</option>
            <option value="24h">Past 24 Hours</option>
            <option value="week" selected>Past Week</option>
            <option value="2weeks">Past 2 Weeks</option>
            <option value="month">Past Month</option>
            <option value="3months">Past 3 Months</option>
          </select>
          <select id="sortFilter" onchange="loadJobs()">
            <option value="score">Best Match</option>
            <option value="date">Most Recent</option>
            <option value="company">Company A-Z</option>
          </select>
        </div>
      </div>

      <div id="jobsList" class="jobs-list">
        <div class="loading">Loading jobs...</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- RIGHT PANEL: Applied Jobs -->
    <div class="panel panel-right">
      <div class="panel-header">
        <h2>Applied</h2>
        <span class="panel-count" id="rightCount">0</span>
      </div>

      <div class="applied-filters">
        <select id="appliedSort" onchange="loadApplied()">
          <option value="date">Most Recent</option>
          <option value="score">Best Match</option>
        </select>
      </div>

      <div id="appliedList" class="jobs-list applied-list">
        <div class="loading">No applications yet</div>
      </div>
    </div>
  </div>

  <!-- Job Detail Modal -->
  <div id="jobModal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
